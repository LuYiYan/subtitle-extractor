name: Build Windows CPU

# 正式版 Windows 便携包。与上游一样用 QPT 打出「启动程序.exe」，再打成不超过
# GitHub 单文件 2GB 限制的 7z。推送到 main、当前打包分支，或手动运行时发布。
on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: false
  push:
    branches:
      - main
      - cursor/windows-portable-c61f

permissions:
  contents: write

concurrency:
  group: windows-cpu-portable
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
    - name: Free disk space
      shell: pwsh
      run: |
        Write-Host ("Free before: {0:N1} GB" -f ((Get-PSDrive C).Free / 1GB))
        @(
          "$env:ProgramFiles\Android",
          "${env:ProgramFiles(x86)}\Android",
          "C:\Program Files\Microsoft SQL Server",
          "C:\Program Files (x86)\Microsoft SQL Server",
          "C:\Program Files (x86)\Microsoft Visual Studio\Shared"
        ) | ForEach-Object {
          if (Test-Path $_) {
            Write-Host "Removing $_"
            Remove-Item -LiteralPath $_ -Recurse -Force -ErrorAction SilentlyContinue
          }
        }
        Write-Host ("Free after: {0:N1} GB" -f ((Get-PSDrive C).Free / 1GB))
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: 读取 VERSION
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' backend/config.py)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      shell: bash
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 确认 Git LFS 权重已落地
      shell: bash
      run: |
        python - <<'PY'
        import os, sys
        checks = [
            "backend/models/sttn-auto/infer_model.pth",
            "backend/models/big-lama/big-lama_1.pt",
            "backend/ffmpeg/win_x64/ffmpeg_1.exe",
            "backend/fonts/NotoSansCJKtc-Regular.otf",
        ]
        failed = False
        for path in checks:
            size = os.path.getsize(path)
            with open(path, "rb") as handle:
                head = handle.read(40)
            pointer = head.startswith(b"version https://git-lfs.github.com/spec/v1")
            print(f"{path}: {size} bytes pointer={pointer}")
            if pointer or size < 1000:
                failed = True
        if failed:
            sys.exit("Git LFS files are still pointers. The portable app would not run.")
        PY
    - name: 禁用硬件加速
      run: sed -i 's/HARDWARD_ACCELERATION_OPTION *= *.*/HARDWARD_ACCELERATION_OPTION = False/g' backend/config.py
      shell: bash
    - name: 下载繁体识别模型
      run: python backend/tools/fetch_rec_model.py
    - run: pip install paddlepaddle==3.0.0
    - run: pip install torch==2.7.0 torchvision==0.22.0
    - run: pip install -r requirements.txt
    - run: pip freeze > requirements.txt
    - run: pip install QPT==1.0b8 setuptools
    - name: 获取 site-packages 路径
      shell: bash
      run: |
        SITE_PACKAGES=$(python -c "import site, os; print(os.path.join(site.getsitepackages()[0], 'Lib', 'site-packages'))")
        SITE_PACKAGES_UNIX=$(cygpath -u "$SITE_PACKAGES")
        echo "site-packages路径: $SITE_PACKAGES"
        echo "site-packages UNIX路径: $SITE_PACKAGES_UNIX"
        echo "SITE_PACKAGES_UNIX=$SITE_PACKAGES_UNIX" >> $GITHUB_ENV
        echo "SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV
    - name: 修复QPT内部错误
      run: sed -i '98c\        try:\n            dep = pkg.requires()\n        except TypeError:\n            continue' ${SITE_PACKAGES_UNIX}/qpt/kernel/qpackage.py
      shell: bash
    - name: Start SSH via tmate
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      uses: mxschmitt/action-tmate@v3
    - name: QPT 打包
      run: |
        python backend/tools/makedist.py && \
        mv ../vsr_out ./vsr_out && \
        cp ./vsr_out/Debug/Debug-进入虚拟环境.cmd ./vsr_out/Release/ && \
        sed -i 's/force=False)/force=False)\n            exit(-1)/g' ./vsr_out/*/Python/Lib/site-packages/qpt/executor.py && \
        test -f ./vsr_out/Release/启动程序.exe && \
        test -f ./vsr_out/Release/使用说明.txt && \
        grep -q pythonw.exe ./vsr_out/Release/configs/entry.cmd && \
        python -c "import struct,sys; p=r'./vsr_out/Release/启动程序.exe'; d=open(p,'rb').read(512); o=struct.unpack_from('<I', d, 0x3C)[0]; sub=struct.unpack_from('<H', open(p,'rb').read(), o+24+68)[0]; sys.exit(0 if sub==2 else 'launcher is still a console exe')" && \
        rm -rf ./vsr_out/Debug
      env:
        QPT_Action: "True"
      shell: bash
    - name: 安装 Inno Setup
      shell: pwsh
      run: |
        $setup = Join-Path $env:TEMP "innosetup.exe"
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $setup
        Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
        $iscc = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw "ISCC.exe was not installed" }
        "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
    - name: 编译安装程序
      shell: pwsh
      run: |
        & $env:ISCC "/DAppVersion=$env:VERSION" "packaging\subtitle-extractor.iss"
        $exe = "vsr_out\installer\subtitle-extractor-v$env:VERSION-windows-cpu-setup.exe"
        if (-not (Test-Path $exe)) { throw "setup.exe was not created" }
        $size = (Get-Item $exe).Length
        Write-Host "setup.exe bytes: $size"
        if ($size -gt 2000000000) { throw "setup.exe exceeds GitHub's 2 GB asset limit" }
        $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
        $name = Split-Path $exe -Leaf
        "$hash  $name  ($size bytes)" | Set-Content -Encoding ascii "vsr_out\installer\$name.sha256"
    - name: 打成 7z
      run: bash packaging/archive_release.sh windows-cpu "$VERSION"
      shell: bash
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: false
        make_latest: true
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: 字幕去除与繁体转换 v${{ env.VERSION }}（Windows 正式版）
        body_path: packaging/RELEASE_zh.md
        files: |
          vsr_out/installer/subtitle-extractor-v${{ env.VERSION }}-windows-cpu-setup.exe
          vsr_out/installer/subtitle-extractor-v${{ env.VERSION }}-windows-cpu-setup.exe.sha256
          vsr_out/Release/subtitle-extractor-v${{ env.VERSION }}-windows-cpu.7z*
          vsr_out/Release/subtitle-extractor-v${{ env.VERSION }}-windows-cpu.sha256
