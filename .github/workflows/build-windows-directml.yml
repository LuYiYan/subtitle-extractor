name: Build Windows DirectML

# 显卡加速包按需手动构建，避免和 CPU 试用包抢同一个 Release。
on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: 读取 VERSION
      id: version
      run: |
        VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' backend/config.py)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      shell: bash
    # - name: 检查 tag 是否已存在
    #   run: |
    #     TAG_NAME="${VERSION}"
    #     if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
    #       echo "Tag $TAG_NAME 已存在，发布中止"
    #       exit 1
    #     fi
    #   shell: bash
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # caching pip dependencies
    - name: 下载繁体识别模型
      run: python backend/tools/fetch_rec_model.py
    - run: pip install paddlepaddle==3.0.0
    - run: pip install -r requirements.txt
    - run: pip freeze > requirements.txt
    - run: pip install torch_directml==0.2.5.dev240914
    - run: pip install QPT==1.0b8 setuptools
    - name: 获取 site-packages 路径
      shell: bash
      run: |
        SITE_PACKAGES=$(python -c "import site, os; print(os.path.join(site.getsitepackages()[0], 'Lib', 'site-packages'))")
        SITE_PACKAGES_UNIX=$(cygpath -u "$SITE_PACKAGES")
        echo "site-packages路径: $SITE_PACKAGES"
        echo "site-packages UNIX路径: $SITE_PACKAGES_UNIX"
        echo "SITE_PACKAGES_UNIX=$SITE_PACKAGES_UNIX" >> $GITHUB_ENV
        echo "SITE_PACKAGES=$SITE_PACKAGES" >> $GITHUB_ENV
    - name: 修复QPT内部错误
      run: sed -i '98c\        try:\n            dep = pkg.requires()\n        except TypeError:\n            continue' ${SITE_PACKAGES_UNIX}/qpt/kernel/qpackage.py
      shell: bash
    - name: Start SSH via tmate
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      uses: mxschmitt/action-tmate@v3
    - run: |
        python backend/tools/makedist.py --directml && \
        mv ../vsr_out ./vsr_out && \
        cp ./vsr_out/Debug/Debug-进入虚拟环境.cmd ./vsr_out/Release/ && \
        sed -i 's/force=False)/force=False)\n            exit(-1)/g' ./vsr_out/*/Python/Lib/site-packages/qpt/executor.py
      env:
        QPT_Action: "True"
      shell: bash
    - name: 打成 7z
      run: |
        rm -rf ./vsr_out/Debug
        bash packaging/archive_release.sh windows-directml "$VERSION"
      shell: bash
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: false
        make_latest: true
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: 字幕去除与繁体转换 v${{ env.VERSION }}（Windows 便携版）
        body_path: packaging/RELEASE_zh.md
        files: |
          vsr_out/Release/subtitle-extractor-v${{ env.VERSION }}-windows-directml.7z*
          vsr_out/Release/subtitle-extractor-v${{ env.VERSION }}-windows-directml.sha256